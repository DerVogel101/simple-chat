<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Schätt Äbb</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .plane {
            position: fixed;
            font-size: 2rem;
            pointer-events: none;
            z-index: 9999;
            animation: flycurve 2.5s ease-in-out forwards;
        }

        @keyframes flycurve {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 1;
            }
            30% {
                transform: translate(120px, -150px) rotate(20deg);
            }
            60% {
                transform: translate(-160px, -250px) rotate(-15deg);
            }
            90% {
                transform: translate(40px, -80px) rotate(10deg);
                opacity: 1;
            }
            100% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <header>
        Willkommen zurück {{username}}!
        <a href='/user/manage'>Self Service Schalter</a>
    </header>

    <div id="messages_holder">
        <!-- Nachrichten werden hier eingefügt -->
    </div>

    <form id="send_msg">
        <input name="msg" type="text" placeholder="Nachricht eingeben..." required/>
        <input value="🛫" type="submit" />
    </form>

    <script>
        // Handle message submission from the input at the bottom.
        //
        // Flow overview:
        // 1) Prevent the default form submit to keep the page from reloading.
        // 2) Send the message via fetch PUT to /messages using FormData.
        // 3) If the server asks us to redirect (e.g., session expired), follow it.
        // 4) On success, clear the input field and show a short plane animation.
        document.getElementById("send_msg").addEventListener("submit", function(e) {
        e.preventDefault();

        // We capture the submit button position to start the plane animation at the button center
        const btn = this.querySelector('input[type="submit"]');
        const rect = btn.getBoundingClientRect();

        // Send the message to the backend as multipart/form-data (FormData picks up the input named "msg")
        fetch("/messages", {
            method: "PUT",
            body: new FormData(this)
        })
        .then(response => {
            // Bottle might respond with a redirect (e.g., if session expired)
            if (response.redirected) {
                window.location.href = response.url;
                return Promise.reject('redirect'); // short-circuit the promise chain
            }
            return response.text(); // backend returns a simple success text
        })
        .then(data => {
            // Clear the text field after a successful send
            this.elements["msg"].value = "";

            // Create and launch the tiny plane animation as a fun visual cue
            const plane = document.createElement("div");
            plane.className = "plane";
            plane.textContent = "🛫";

            // Start position = center of the submit button
            plane.style.left = rect.left + rect.width / 2 + "px";
            plane.style.top = rect.top + rect.height / 2 + "px";

            document.body.appendChild(plane);

            // Remove the temporary element once the CSS animation finishes
            plane.addEventListener("animationend", () => {
                plane.remove();
            });
        })
        .catch(() => { /* Intentionally ignore errors here to keep typing uninterrupted */ });
    });

    </script>
    <script>
        // Simple polling loop to fetch and render new messages.
        //
        // State:
        // - lastId: highest message id we have rendered so far (used for incremental fetches)
        // - lastDate: tracks the last rendered calendar date to insert date separators when the date changes
        let lastId = 0;
        let lastDate = "";

        function fetchMessages() {
            // Ask the server only for messages newer than lastId to reduce payload
            fetch(`/messages?last_id=${lastId}`)
                .then(response => {
                    // If our session is gone, the backend redirects to /auth; honor it immediately
                    if (response.redirected) {
                        window.location.href = response.url;
                        return Promise.reject('redirect');
                    }
                    // Guard against receiving an HTML page (e.g., a login form) instead of JSON
                    const ct = response.headers.get('content-type') || '';
                    if (!ct.includes('application/json')) {
                        // Consume the body to avoid unhandled promise warnings, then bail out
                        return response.text().then(() => Promise.reject('non-json'));
                    }
                    return response.json();
                })
                .then(data => {
                    const holder = document.getElementById("messages_holder");
                    data.forEach(msg => {
                        // The backend returns: [username, id, email, text, timestamp, color]
                        const [name, id, email, text, timestamp, color] = msg;
                        const date = timestamp.split(" ")[0];
                        const time = timestamp.split(" ")[1].slice(0,5); // HH:MM

                        // Insert date separator when the day changes
                        if (date !== lastDate) {
                            const dateDiv = document.createElement("div");
                            dateDiv.className = "date-separator";
                            dateDiv.textContent = date;
                            holder.appendChild(dateDiv);
                            lastDate = date;
                        }

                        // Build a message row: [meta][text]
                        const div = document.createElement("div");
                        div.className = "message";

                        const meta = document.createElement("span");
                        meta.className = "meta";
                        meta.style.color = color; // per-user color supplied by the server
                        meta.textContent = `${name} ${time}:`;

                        const msgText = document.createElement("span");
                        msgText.className = "msg-text";
                        msgText.textContent = text;

                        div.appendChild(meta);
                        div.appendChild(msgText);

                        holder.appendChild(div);
                        if (id > lastId) lastId = id; // advance waterline for next poll

                        // Always keep the view scrolled to the newest message
                        holder.scrollTop = holder.scrollHeight;
                    });
                })
                // Swallow transient errors (network hiccups, auth redirects handled above)
                .catch(() => {});
        }

        // Poll every 1 seconds; also fetch immediately on page load
        setInterval(fetchMessages, 1000);
        fetchMessages();
    </script>
</body>
</html>
