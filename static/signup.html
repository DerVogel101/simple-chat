<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Schätt Äbb — Sign up</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<form id="auth-form" action="/signup" method="post" novalidate>
    <div class="auth-card">
        <h1 class="app-title">Schätt Äbb — Sign up</h1>

        <div class="field">
            <label class="label-text" for="username">Username</label>
            <input id="username" name="username" type="text" required />
        </div>

        <div class="field">
            <label class="label-text" for="username_confirm">Confirm Username</label>
            <input id="username_confirm" name="username_confirm" type="text" required />
        </div>

        <div class="field">
            <label class="label-text" for="password">Password</label>
            <input id="password" name="password" type="password" required />
        </div>

        <div class="field">
            <label class="label-text" for="password_confirm">Confirm Password</label>
            <input id="password_confirm" name="password_confirm" type="password" required />
        </div>

        <div id="validation-message" aria-live="polite" class="validation"></div>

        <div class="actions">
            <input id="submit-btn" class="btn primary" value="Sign up" type="submit" />
            <a class="btn link" href="/auth">Already have an account?</a>
        </div>
    </div>
</form>

<script type="text/javascript">
    // Client-side validation for the signup form.
    //
    // Goals:
    // - Prevent obvious mistakes (mismatched username/password confirmation) before sending a POST.
    // - Provide immediate, accessible feedback through a live region (aria-live="polite").
    // - Keep logic minimal; the server remains the source of truth for validation.
    (function () {
        // Cache references to form elements for clarity and performance
        const form = document.getElementById('auth-form');
        const username = document.getElementById('username');
        const usernameConfirm = document.getElementById('username_confirm');
        const password = document.getElementById('password');
        const passwordConfirm = document.getElementById('password_confirm');
        const msg = document.getElementById('validation-message');

        // Returns true when all quick checks pass. Otherwise sets an error message and returns false.
        function validate() {
            // Clear previous message to ensure screen readers announce the latest update
            msg.textContent = '';

            // Presence check; HTML 'required' attributes also assist here
            if (!username.value || !usernameConfirm.value || !password.value || !passwordConfirm.value) {
                // We still set a friendly summary to guide the user
                msg.textContent = 'Please fill all fields.';
                return false;
            }

            // Compare usernames
            if (username.value !== usernameConfirm.value) {
                msg.textContent = 'Usernames do not match.';
                return false;
            }

            // Compare passwords (no strength/length enforcement here)
            if (password.value !== passwordConfirm.value) {
                msg.textContent = 'Passwords do not match.';
                return false;
            }

            // Extension point: enforce length/complexity (e.g., password length >= 8)
            return true;
        }

        // Live validation: run on any input change to give immediate feedback
        [username, usernameConfirm, password, passwordConfirm].forEach(el =>
            el.addEventListener('input', validate)
        );

        // Final gate on submit; keep focus on the first problematic field
        form.addEventListener('submit', function (e) {
            if (!validate()) {
                e.preventDefault();
                // Direct focus to the first field that needs attention for better accessibility
                if (username.value !== usernameConfirm.value) {
                    usernameConfirm.focus();
                } else if (password.value !== passwordConfirm.value) {
                    passwordConfirm.focus();
                }
            }
        }, false);
    })();
</script>

</body>
</html>
