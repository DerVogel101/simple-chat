<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Login Fehlgeschlagen</title>
    <style>
        body {
            background-color: #ff0000;
            color: yellow;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            padding-top: 100px;
            animation: flash-bg 1s infinite;
        }

        @keyframes flash-bg {
            0% { background-color: red; }
            50% { background-color: orange; }
            100% { background-color: red; }
        }

        .blink {
            font-size: 2em;
            animation: blinker 0.6s linear infinite;
        }

        @keyframes blinker {
            50% { opacity: 0; }
        }

        a {
            display: block;
            margin-top: 30px;
            font-size: 1.5em;
            color: cyan;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        iframe {
            margin-top: 50px;
            border: 5px dashed lime;
        }
    </style>
</head>
<body>
    <div class="blink">❌ Login fehlgeschlagen! ❌</div>
    <a href="/auth">🔐 Zurück zur Login-Seite</a>
    <iframe width="560" height="315"
            src="https://www.youtube.com/embed/sw0vg8N1Zi4?si=ifeHF1A-EclWUzVC&amp;controls=0&amp;autoplay=1"
            title="YouTube video player"
            frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
    </iframe>
</body>
</html>
