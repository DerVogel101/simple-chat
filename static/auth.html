<form action="/auth" method="post">
    <div class="auth-card">
        <h1 class="app-title">Schätt Äbb</h1>

        <label class="field">
            <span class="label-text">E-Mail</span>
            <input id="email" name="email" type="text" required/>
        </label>

        <label class="field">
            <span class="label-text">Password</span>
            <input id="password" name="password" type="password" required/>
        </label>

        <div class="actions">
            <input class="btn primary" value="Login" type="submit" />
            <a class="btn link" href="/signup">Sign up</a>
        </div>
        <div id="validation-message" aria-live="polite" class="validation"></div>
    </div>
</form>

<script type="text/javascript">
    // Client-side guardrails for the login form.
    //
    // What this script does (high-level):
    // - Grabs references to the login form and its fields.
    // - Performs a minimal validation before the browser sends the POST request.
    // - Shows a friendly inline validation message and keeps focus in the form if data is missing.
    //
    // Notes:
    // - This enhances user experience only; the server still validates credentials.
    // - We intentionally keep logic simple to avoid blocking legitimate submissions.
    (function () {
        // Query key DOM elements once to avoid repeated lookups
        const form = document.querySelector('form[action="/auth"]');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const msg = document.getElementById('validation-message');

        // Return true when inputs look OK. Otherwise set an inline message and return false.
        function validate() {
            // Clear any previous validation message
            msg.textContent = '';

            // Minimal presence check: both fields required (HTML 'required' also helps)
            if (!email.value || !password.value) {
                msg.textContent = 'Please fill email and password.';
                return false;
            }
            // Potential extension point: enforce minimum length / password complexity here
            return true;
        }

        // Intercept submit to run validation before the request is sent
        form.addEventListener('submit', function (e) {
            if (!validate()) {
                // Stop the form submission and guide the user to the first field
                e.preventDefault();
            }
        }, false);
    })();
</script>

<link rel="stylesheet" href="/style.css">
